name: Export release keystore passwords (PGP encrypted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Encrypt release keystore passwords for recovery
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Encrypt and remove release keystore passwords
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_FINGERPRINT: EBE931E39CCA308D2F9CE75E1AC916B51365EB88
        run: |
          set -euo pipefail
          umask 077

          plaintext="$RUNNER_TEMP/release-keystore-passwords.txt"
          encrypted="$RUNNER_TEMP/release-keystore-passwords.txt.gpg"
          public_key="$RUNNER_TEMP/girino-recovery.asc"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"

          cleanup() {
            rm -f "$plaintext" "$public_key"
            gpgconf --homedir "$GNUPGHOME" --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          }
          trap cleanup EXIT

          mkdir -m 700 "$GNUPGHOME"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf 'Keystore password:\n%s\n\nKey password:\n%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" > "$plaintext"

          cat > "$public_key" <<'EOF'
          -----BEGIN PGP PUBLIC KEY BLOCK-----
          Comment: User ID:	Girino pass repository (GPG key for my password manager) <pass@girino.org>
          Comment: Valid from:	15/06/2024 15:29
          Comment: Type:	255-bit EdDSA (secret key available)
          Comment: Usage:	Signing, Encryption, Certifying User IDs
          Comment: Fingerprint:	EBE931E39CCA308D2F9CE75E1AC916B51365EB88

          mDMEZm3ddRYJKwYBBAHaRw8BAQdAs6tAb8npYtFIL2rKggsaN4/FkYsyvnMrjnEY
          7eEn7xu0SkdpcmlubyBwYXNzIHJlcG9zaXRvcnkgKEdQRyBrZXkgZm9yIG15IHBh
          c3N3b3JkIG1hbmFnZXIpIDxwYXNzQGdpcmluby5vcmc+iJAEExYIADgWIQTr6THj
          nMowjS+c514ayRa1E2XriAUCZm3ddQIbAwULCQgHAgYVCgkICwIEFgIDAQIeAQIX
          gAAKCRAayRa1E2XriD0CAP4jB/O9/Cbs+FAb+Hko+t7qADfbOvI5eVrOKbHRSeo5
          8wD9FRmY98xyFHpCcUQzK1obfKSm/XioRb1TD4TuCqNoVQ24OARmbd11EgorBgEE
          AZdVAQUBAQdAsyn5rntwt7Gsyei531T4KaQhJfSBuZcAnAoeshYAMRUDAQgHiHgE
          GBYIACAWIQTr6THjnMowjS+c514ayRa1E2XriAUCZm3ddQIbDAAKCRAayRa1E2Xr
          iCxFAQCuGzQtpJSe8wp9UhDsWPMZn36V/GQR/2ykJEAUfXAdhgEAx7m419glcB7u
          WahlO/aA3RLdkCOW56OzWxR1XJie8wg=
          =5CYr
          -----END PGP PUBLIC KEY BLOCK-----
          EOF

          gpg --batch --quiet --import "$public_key"
          actual_fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$actual_fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --trust-model always --output "$encrypted" --recipient "$EXPECTED_FINGERPRINT" --encrypt "$plaintext"
          rm -f "$plaintext"

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-release-keystore-passwords-pgp
          path: ${{ runner.temp }}/release-keystore-passwords.txt.gpg
          if-no-files-found: error
          retention-days: 1
