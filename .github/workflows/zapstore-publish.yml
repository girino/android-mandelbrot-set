name: Publish Zapstore

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.0.1)
        required: true
        default: v1.0.1

permissions:
  contents: read

concurrency:
  group: zapstore-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-zapstore:
    name: Publish ${{ inputs.tag }} to Zapstore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_ZAPSTORE_SIGNING: ${{ secrets.ZAPSTORE_BUNKER_URL != '' || secrets.ZAPSTORE_NSEC != '' }}
    steps:
      - name: Skip if Zapstore signing not configured
        if: env.HAS_ZAPSTORE_SIGNING != 'true'
        run: |
          echo "ZAPSTORE_BUNKER_URL or ZAPSTORE_NSEC secret not set — cannot publish."
          echo "Add one of those repository secrets in GitHub Settings, then re-run."
          exit 1

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install zsp
        run: |
          ZSP_VERSION=$(curl -fsSL https://api.github.com/repos/zapstore/zsp/releases/latest | jq -r .tag_name)
          ZSP_VERSION_NUM="${ZSP_VERSION#v}"
          curl -fsSL -o zsp \
            "https://github.com/zapstore/zsp/releases/download/${ZSP_VERSION}/zsp-${ZSP_VERSION_NUM}-linux-amd64"
          chmod +x zsp
          sudo install zsp /usr/local/bin/zsp
          zsp --version

      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_BUNKER_URL != '' && secrets.ZAPSTORE_BUNKER_URL || secrets.ZAPSTORE_NSEC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zsp publish -q zapstore.yaml
