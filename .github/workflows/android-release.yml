name: Android release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required GitHub secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint, and build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon

      - name: Prepare release assets
        id: release_type
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          asset="Fractals-by-Girino-FOSS-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Fractals by Girino FOSS ${{ github.ref_name }}
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          body: |
            ## Install with Obtainium

            On Android, open this Obtainium link:

            `obtainium://add?url=https%3A%2F%2Fgithub.com%2Fgirino%2Fandroid-mandelbrot-set`

            If the link does not open, open **Add App** in Obtainium and enter
            `https://github.com/girino/android-mandelbrot-set` as the app source URL.
            Keep **Include prereleases** disabled for stable versions, or enable it
            to receive alpha, beta, and other test builds.

            This APK is signed with the upstream author's key. It cannot update an
            installation from the official F-Droid repository because F-Droid uses
            a different signing key.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release_type.outputs.asset }}
            ${{ steps.release_type.outputs.asset }}.sha256

  publish-zapstore:
    name: Publish to Zapstore
    runs-on: ubuntu-latest
    needs: release
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HAS_ZAPSTORE_SIGNING: ${{ secrets.ZAPSTORE_BUNKER_URL != '' || secrets.ZAPSTORE_NSEC != '' }}
    steps:
      - name: Skip if Zapstore signing not configured
        if: env.HAS_ZAPSTORE_SIGNING != 'true'
        run: |
          echo "ZAPSTORE_BUNKER_URL or ZAPSTORE_NSEC secret not set — skipping Zapstore publish."
          echo "Add one of those repository secrets, then re-run this job or workflow."

      - name: Check out tagged revision
        if: env.HAS_ZAPSTORE_SIGNING == 'true'
        uses: actions/checkout@v6

      - name: Install zsp
        if: env.HAS_ZAPSTORE_SIGNING == 'true'
        run: |
          ZSP_VERSION=$(curl -fsSL https://api.github.com/repos/zapstore/zsp/releases/latest | jq -r .tag_name)
          ZSP_VERSION_NUM="${ZSP_VERSION#v}"
          curl -fsSL -o zsp \
            "https://github.com/zapstore/zsp/releases/download/${ZSP_VERSION}/zsp-${ZSP_VERSION_NUM}-linux-amd64"
          chmod +x zsp
          sudo install zsp /usr/local/bin/zsp
          zsp --version

      - name: Publish to Zapstore
        if: env.HAS_ZAPSTORE_SIGNING == 'true'
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_BUNKER_URL != '' && secrets.ZAPSTORE_BUNKER_URL || secrets.ZAPSTORE_NSEC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zsp publish -q zapstore.yaml
